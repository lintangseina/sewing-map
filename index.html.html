<!DOCTYPE html>

<meta charset="UTF-8"/>

<title>Sewing Line Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #16213e; border-bottom: 1px solid #0f3460; }
  .header h2 { font-size: 14px; font-weight: 600; color: #e2e8f0; letter-spacing: 1px; text-transform: uppercase; flex: 1; }

  .floor-tabs { display: flex; gap: 6px; }
  .floor-btn {
    padding: 6px 18px; border-radius: 20px; border: 1px solid #0f3460;
    background: transparent; color: #94a3b8; cursor: pointer;
    font-size: 12px; font-weight: 600; transition: all 0.2s;
  }
  .floor-btn:hover { background: #0f3460; color: #e2e8f0; }
  .floor-btn.active { background: #e94560; border-color: #e94560; color: white; }

  .selected-info {
    padding: 6px 16px; background: #0f3460; font-size: 12px; color: #94a3b8;
    min-height: 30px; display: flex; align-items: center; gap: 8px;
  }
  .selected-badge {
    background: #e94560; color: white; padding: 2px 10px;
    border-radius: 10px; font-weight: 700; font-size: 11px;
  }
  .clear-btn {
    margin-left: auto; background: transparent; border: 1px solid #94a3b8;
    color: #94a3b8; padding: 2px 10px; border-radius: 10px;
    cursor: pointer; font-size: 11px; display: none;
  }
  .clear-btn.visible { display: block; }

  .map-container { flex: 1; overflow: hidden; position: relative; }
  .floor-map { width: 100%; height: 100%; display: none; }
  .floor-map.active { display: block; }

  svg { width: 100%; height: 100%; }

  .svg-location {
    cursor: pointer;
    transition: filter 0.15s, opacity 0.15s;
  }
  .svg-location:hover { filter: brightness(1.3); }
  .svg-location.selected { filter: brightness(1.0) drop-shadow(0 0 6px #e94560) !important; stroke: #e94560 !important; stroke-width: 150 !important; }
  .svg-location.dimmed { opacity: 0.3; }

  .tooltip {
    position: absolute; background: #16213e; border: 1px solid #e94560;
    color: #eee; padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600; pointer-events: none;
    display: none; z-index: 100; white-space: nowrap;
  }
</style>
</head>

<script>
  let selectedLocation = null;

  function switchFloor(floor) {
    document.querySelectorAll('.floor-map').forEach(m => m.classList.remove('active'));
    document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('floor' + floor).classList.add('active');
    document.querySelectorAll('.floor-btn')[floor - 2].classList.add('active');
    clearSelection();
    bindEvents();
  }

  function bindEvents() {
    document.querySelectorAll('.floor-map.active .svg-location').forEach(el => {
      el.onclick = function(e) {
        const loc = this.getAttribute('data-location');
        if (!loc) return;
        selectLocation(loc);
      };
      el.onmousemove = function(e) {
        const loc = this.getAttribute('data-location');
        if (!loc) return;
        const tip = document.getElementById('tooltip');
        tip.textContent = loc;
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px';
        tip.style.top = (e.clientY - 30) + 'px';
      };
      el.onmouseleave = function() {
        document.getElementById('tooltip').style.display = 'none';
      };
    });
  }

  function selectLocation(loc) {
    if (selectedLocation === loc) {
      clearSelection();
      return;
    }
    selectedLocation = loc;
    const all = document.querySelectorAll('.floor-map.active .svg-location');
    all.forEach(el => {
      const elLoc = el.getAttribute('data-location');
      if (elLoc === loc) {
        el.classList.add('selected');
        el.classList.remove('dimmed');
      } else if (elLoc) {
        el.classList.remove('selected');
        el.classList.add('dimmed');
      }
    });

    const info = document.getElementById('selectedInfo');
    info.innerHTML = `Selected: <span class="selected-badge">${loc}</span> <button class="clear-btn visible" onclick="clearSelection()">✕ Clear</button>`;

    // Power BI filter via postMessage
    window.parent.postMessage(JSON.stringify({
      type: 'filter',
      column: 'Sewing Line',
      value: loc
    }), '*');
  }

  function clearSelection() {
    selectedLocation = null;
    document.querySelectorAll('.svg-location').forEach(el => {
      el.classList.remove('selected', 'dimmed');
    });
    document.getElementById('selectedInfo').innerHTML = '<span>Click a sewing line to filter</span>';
    window.parent.postMessage(JSON.stringify({ type: 'clearFilter' }), '*');
  }

  bindEvents();
</script>
</body>
</html>
