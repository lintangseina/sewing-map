<meta charset="UTF-8"/>

<title>Sewing Line Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #222; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #f8f9fa; border-bottom: 1px solid #dde1e7; }
  .header h2 { font-size: 14px; font-weight: 600; color: #222; letter-spacing: 1px; text-transform: uppercase; flex: 1; }

  .floor-tabs { display: flex; gap: 6px; }
  .floor-btn {
    padding: 6px 18px; border-radius: 20px; border: 1px solid #c8cdd6;
    background: transparent; color: #6b7280; cursor: pointer;
    font-size: 12px; font-weight: 600; transition: all 0.2s;
  }
  .floor-btn:hover { background: #e8eaf0; color: #222; }
  .floor-btn.active { background: #2563eb; border-color: #2563eb; color: white; }

  .selected-info {
    padding: 6px 16px; background: #f0f4ff; font-size: 12px; color: #6b7280;
    min-height: 30px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid #dde1e7;
  }
  .selected-badge {
    background: #2563eb; color: white; padding: 2px 10px;
    border-radius: 10px; font-weight: 700; font-size: 11px;
  }

  .map-container { flex: 1; overflow: hidden; position: relative; }
  .floor-map { width: 100%; height: 100%; display: none; }
  .floor-map.active { display: block; }

  svg { width: 100%; height: 100%; }

  .svg-location {
    cursor: pointer;
    transition: filter 0.15s, opacity 0.15s;
  }
  .svg-location:hover { filter: brightness(1.15); }
  .svg-location.dimmed { opacity: 0.25; }

  .tooltip {
    position: absolute; background: #fff; border: 1px solid #2563eb;
    color: #1e40af; padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600; pointer-events: none;
    display: none; z-index: 100; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
</style>
</head>

<div class="header">
  <h2>🏭 Sewing Line Map</h2>
