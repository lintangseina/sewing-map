<meta charset="UTF-8"/>

<title>Sewing Line Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body { font-family: 'Segoe UI', sans-serif; background: #fff; color: #222; height: 100%; display: flex; flex-direction: column; overflow: hidden; }

  .header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #f8f9fa; border-bottom: 1px solid #dde1e7; }
  .header h2 { font-size: 14px; font-weight: 600; color: #222; letter-spacing: 1px; text-transform: uppercase; flex: 1; }

  .floor-tabs { display: flex; gap: 6px; }
  .floor-btn {
    padding: 6px 18px; border-radius: 20px; border: 1px solid #c8cdd6;
    background: transparent; color: #6b7280; cursor: pointer;
    font-size: 12px; font-weight: 600; transition: all 0.2s;
  }
  .floor-btn:hover { background: #e8eaf0; color: #222; }
  .floor-btn.active { background: #2563eb; border-color: #2563eb; color: white; }

  .selected-info {
    padding: 6px 16px; background: #f0f4ff; font-size: 12px; color: #6b7280;
    min-height: 30px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid #dde1e7;
  }
  .selected-badge {
    background: #2563eb; color: white; padding: 2px 10px;
    border-radius: 10px; font-weight: 700; font-size: 11px;
  }

  .map-container { flex: 1; overflow: hidden; position: relative; min-height: 0; }
  .floor-map { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .floor-map.active { display: block; }

  svg { width: 100%; height: 100%; display: block; }

  .svg-location {
    cursor: pointer;
    transition: filter 0.15s, opacity 0.15s;
  }
  .svg-location:hover { filter: brightness(1.15); }
  .svg-location.dimmed { opacity: 0.25; }

  .tooltip {
    position: absolute; background: #fff; border: 1px solid #2563eb;
    color: #1e40af; padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600; pointer-events: none;
    display: none; z-index: 100; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
</style>
</head>

<script>
let selectedLocation = null;

function switchFloor(floor) {
  document.querySelectorAll('.floor-map').forEach(m => m.classList.remove('active'));
  document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('floor' + floor).classList.add('active');
  document.querySelectorAll('.floor-btn')[floor - 2].classList.add('active');
  clearSelection();
  attachListeners();
}

function clearSelection() {
  selectedLocation = null;
  document.querySelectorAll('.svg-location').forEach(el => {
    el.classList.remove('selected', 'dimmed');
  });
  document.getElementById('selectedInfo').innerHTML = '<span>Click a sewing line to filter</span>';
  document.getElementById('tooltip').style.display = 'none';
}

function attachListeners() {
  document.querySelectorAll('.svg-location').forEach(el => {
    el.onclick = function(e) {
      const loc = this.getAttribute('data-location');
      if (selectedLocation === loc) {
        clearSelection();
        return;
      }
      selectedLocation = loc;
      document.querySelectorAll('.svg-location').forEach(other => {
        if (other.getAttribute('data-location') === loc) {
          other.classList.add('selected');
          other.classList.remove('dimmed');
        } else {
          other.classList.remove('selected');
          other.classList.add('dimmed');
        }
      });
      document.getElementById('selectedInfo').innerHTML =
        'Selected: <span class="selected-badge">' + loc + '</span>';
    };
    el.onmousemove = function(e) {
      const t = document.getElementById('tooltip');
      t.textContent = this.getAttribute('data-location');
      t.style.display = 'block';
      t.style.left = (e.clientX + 12) + 'px';
      t.style.top = (e.clientY - 28) + 'px';
    };
    el.onmouseleave = function() {
      document.getElementById('tooltip').style.display = 'none';
    };
  });
}

attachListeners();
</script>
